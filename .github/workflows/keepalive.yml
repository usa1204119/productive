name: keep-render-warm

# Backup wake-up for the free-tier Render service. The PRIMARY keep-warm is the
# server's own self-ping (apps/server/src/index.ts, every 10 min) which reliably
# resets the idle timer while the instance is running. This workflow only needs
# to WAKE the instance if it ever fully slept (a deploy gap, a crash). GitHub's
# scheduler is best-effort and often runs late, so each run also loops a few
# pings ~60s apart to widen the coverage window.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health repeatedly
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS --max-time 40 https://productive-kel1.onrender.com/health || echo "ping $i failed"
            [ "$i" -lt 5 ] && sleep 60
          done
