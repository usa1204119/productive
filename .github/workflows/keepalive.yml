name: keep-render-warm

# Pings the free-tier Render service so it does not spin down (~15 min idle),
# which otherwise causes cold-start 502s and the "No slides yet" flash on load.
# GitHub's scheduler is best-effort and often runs a few minutes late, so this
# is a backup — a dedicated uptime monitor (UptimeRobot / cron-job.org) hitting
# the same /health URL every 10 min is more reliable.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 30 https://productive-kel1.onrender.com/health
